# Onboarding preferences, not a scheduler or authorization broker.
# Times and enabled state live only in the referenced automation files.
schema_version: "4.2.0"
timezone: Europe/Kyiv
timezone_basis: session_environment
execution_mode: draft_only
activation: manual_pilot_first
loops:
  inbox:
    selected: true
    automation_files:
      - nimbalyst-local/automations/inbox-morning.md
      - nimbalyst-local/automations/inbox-afternoon.md
